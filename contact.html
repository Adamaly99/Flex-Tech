<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | FlexTech</title>
  <meta name="description" content="Contactez FlexTech pour vos besoins en ordinateurs, accessoires et services informatiques.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="assets/images/logo.png" alt="FlexTech Logo">
      </a>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="produits.html">Produits</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <a href="#" class="cart-icon">🛒<span class="cart-count">0</span></a>
    </div>
  </header>

  <section class="section contact">
    <div class="container">
      <h1 class="section-title">Nous Contacter</h1>

      <form class="contact-form fade-in">
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Sujet</label>
          <input type="text" id="subject">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn-primary">Envoyer</button>
      </form>

      <div style="margin-top:40px; text-align:center;">
        <p><strong>Adresse :</strong> Mbour, Sénégal</p>
        <p><strong>Téléphone :</strong> +221 77 XXX XX XX</p>
        <p><strong>Email :</strong> contact@flextech.sn</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 FlexTech. Tous droits réservés.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
